name: Run C CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: build-test-and-analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C "$GITHUB_WORKSPACE" -c "http.extraheader=AUTHORIZATION: basic $auth_header" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cppcheck \
            flawfinder \
            libcjson-dev \
            libcunit1-dev \
            libcurl4-openssl-dev

      - name: Build
        run: make

      - name: Run unit tests
        run: make test

      - name: Run static analysis
        run: |
          mkdir -p reports
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --template=gcc src test 2>&1 | tee reports/cppcheck_report.txt
          flawfinder --sarif src test > reports/flawfinder_results.sarif
