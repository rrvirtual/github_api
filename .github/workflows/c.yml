name: Run C CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: build-test-and-analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out this repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C "$GITHUB_WORKSPACE" -c "http.extraheader=AUTHORIZATION: basic $auth_header" fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cppcheck \
            doxygen \
            flawfinder \
            libcjson-dev \
            libcunit1-dev \
            libcurl4-openssl-dev

      - name: Build
        run: make

      - name: Run unit tests
        run: make test

      - name: Run static analysis
        run: |
          mkdir -p reports
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --template=gcc src test 2>&1 | tee reports/cppcheck_report.txt
          flawfinder --sarif src test > reports/flawfinder_results.sarif

      - name: Check whether source or Doxygen configuration changed
        id: docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          if git -c "http.extraheader=AUTHORIZATION: basic $auth_header" \
              fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
            if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- src Doxyfile; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Could not fetch the previous revision; regenerating documentation."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate HTML documentation
        if: steps.docs.outputs.changed == 'true'
        run: doxygen Doxyfile

      - name: Update doc/html on main
        if: steps.docs.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- doc/html)" ]; then
            echo "Generated documentation is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/html
          git commit -m "docs: update generated HTML documentation"

          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth_header" \
            push origin HEAD:main
